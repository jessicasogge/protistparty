<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ProtistParty: A Protistology Game</title>
    <meta name="description" content="A free protistology game: steer a real protist through a drop of pond water, eat bacteria and split in two. The sister game to PetriPals, FunGals and CellMates." />
    <link rel="canonical" href="https://jessicasogge.github.io/protistparty/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="./fonts/fredoka-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- The protists, drawn by script.js from game/protists.js -->
    <div class="friends"></div>

    <h1 class="logo">ProtistParty</h1>
    <p class="tagline">Eat bacteria. Split in two. Beat the drying drop.</p>
    <button class="start-btn" type="button">Press Start to Play</button>
    <p class="about">
      Pick a real protist, drawn as a cartoon, and grow her colony in a drop
      of pond water before it dries.
      The sister game to <a href="https://jessicasogge.github.io/petripals/">PetriPals</a>,
      <a href="https://jessicasogge.github.io/fungals/">FunGals</a>
      and <a href="https://jessicasogge.github.io/cellmates/">CellMates</a>.
    </p>
    <footer class="signature">jsogge 2026</footer>
    <script type="module" src="./script.js"></script>
    <script data-goatcounter="https://petripals.goatcounter.com/count"
            async src="https://gc.zgo.at/count.js"></script>
  </body>
</html>
